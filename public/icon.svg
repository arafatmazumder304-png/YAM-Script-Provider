<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Background with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Subtle Inner Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#primaryGrad)" stroke-width="2" stroke-opacity="0.2" />

  <!-- Central Shield / Badge Container -->
  <rect x="100" y="100" width="312" height="312" rx="64" fill="url(#primaryGrad)" filter="url(#glow)" />
  <rect x="108" y="108" width="296" height="296" rx="56" fill="#090d1c" />

  <!-- Code brackets indicator </> in top-right / background -->
  <path d="M 160 210 L 130 256 L 160 302" stroke="#4f46e5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
  <path d="M 352 210 L 382 256 L 352 302" stroke="#ec4899" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>

  <!-- Stylized Modern Bold "Y" Monogram for YAM -->
  <path d="M 190 170 L 256 265 L 322 170" fill="none" stroke="url(#accentGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 256 265 L 256 345" fill="none" stroke="url(#accentGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Glowing Core Accent Dot -->
  <circle cx="256" cy="265" r="8" fill="#ffffff" />

  <!-- Market Script Label -->
  <text x="256" y="385" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="26" fill="#c7d2fe" text-anchor="middle" letter-spacing="4">SCRIPTS</text>
</svg>
