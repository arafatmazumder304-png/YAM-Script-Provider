<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="primaryGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="accentGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Inner Safe Area Badge (radius ~180px safe zone) -->
  <rect x="130" y="130" width="252" height="252" rx="52" fill="url(#primaryGradMask)" />
  <rect x="136" y="136" width="240" height="240" rx="46" fill="#090d1c" />

  <!-- Stylized Modern Bold "Y" Monogram for YAM -->
  <path d="M 200 195 L 256 270 L 312 195" fill="none" stroke="url(#accentGradMask)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 256 270 L 256 335" fill="none" stroke="url(#accentGradMask)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="256" cy="270" r="7" fill="#ffffff" />
</svg>
